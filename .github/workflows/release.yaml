name: release
on:
  push:
    tags: ['v*']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      solution_path: ${{ steps.repository.outputs.solution_path }}
      has_executables: ${{ steps.repository.outputs.has_executables }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - id: repository
        shell: pwsh
        run: ./packaging/Get-RepositoryMetadata.ps1 -Configuration '${{ env.CONFIGURATION }}' -GitHubOutputPath $env:GITHUB_OUTPUT
      - name: Require tagged commit on default branch
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin $env:DEFAULT_BRANCH --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA "origin/$env:DEFAULT_BRANCH"
          if (0 -ne $LASTEXITCODE) { throw "Release tag is not contained in '$env:DEFAULT_BRANCH'." }
      - id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?)$') { throw 'Unsupported release tag.' }
          $version=$Matches.version
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
  package:
    needs: metadata
    runs-on: ubuntu-latest
    outputs:
      has_packages: ${{ steps.select.outputs.has_packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore '${{ needs.metadata.outputs.solution_path }}'
      - run: dotnet build '${{ needs.metadata.outputs.solution_path }}' -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet pack '${{ needs.metadata.outputs.solution_path }}' -c Release --no-build --no-restore -o artifacts/release -p:ContinuousIntegrationBuild=true
      - id: select
        shell: pwsh
        run: ./packaging/SelectReleasePackages.ps1 -SourceDirectory artifacts/release -DestinationDirectory artifacts/release-packages -ExpectedVersion '${{ needs.metadata.outputs.version }}' -GitHubOutputPath $env:GITHUB_OUTPUT
      - name: Verify packages
        if: steps.select.outputs.has_packages == 'true'
        shell: pwsh
        run: ./packaging/VerifyPackageArtifact.ps1 -ArtifactDirectory artifacts/release-packages -Configuration Release -ExpectedVersion '${{ needs.metadata.outputs.version }}'
      - name: Upload packages
        if: steps.select.outputs.has_packages == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/release-packages/*.nupkg
  archives:
    needs: metadata
    if: needs.metadata.outputs.has_executables == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
          - { os: ubuntu-24.04, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-15, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - shell: pwsh
        run: ./packaging/BuildReleaseArchive.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -Version '${{ needs.metadata.outputs.version }}' -ArchiveBaseName '${{ github.event.repository.name }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-archive-${{ matrix.rid }}
          path: artifacts/release/${{ github.event.repository.name }}-${{ needs.metadata.outputs.version }}-${{ matrix.rid }}.zip
  publish-nuget:
    needs: [metadata, package]
    if: needs.package.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/package
      - id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          Get-ChildItem artifacts/package -Filter '*.nupkg' | ForEach-Object {
            dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if (0 -ne $LASTEXITCODE) { throw "NuGet publication failed for '$($_.Name)'." }
          }
  publish-github-packages:
    needs: [metadata, package]
    if: needs.package.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/package
      - shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Get-ChildItem artifacts/package -Filter '*.nupkg' | ForEach-Object {
            dotnet nuget push $_.FullName --api-key $env:GITHUB_TOKEN --source 'https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json' --skip-duplicate
            if (0 -ne $LASTEXITCODE) { throw "GitHub Packages publication failed for '$($_.Name)'." }
          }
  github-release:
    needs: [metadata, package, archives, publish-nuget, publish-github-packages]
    if: always() && needs.metadata.result == 'success' && needs.package.result == 'success' && (needs.archives.result == 'success' || needs.archives.result == 'skipped') && (needs.publish-nuget.result == 'success' || needs.publish-nuget.result == 'skipped') && (needs.publish-github-packages.result == 'success' || needs.publish-github-packages.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        if: needs.package.outputs.has_packages == 'true'
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/assets
      - name: Download archives
        if: needs.metadata.outputs.has_executables == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: release-archive-*
          path: artifacts/assets
          merge-multiple: true
      - name: Create checksums and release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files=@(Get-ChildItem artifacts/assets -File | Sort-Object Name)
          $lines=$files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" }
          [IO.File]::WriteAllLines((Join-Path (Resolve-Path artifacts/assets) 'SHA256SUMS.txt'),$lines,[Text.UTF8Encoding]::new($false))
          $assets=@(Get-ChildItem artifacts/assets -File | ForEach-Object { $_.FullName })
          $args=@('release','create',$env:GITHUB_REF_NAME,'--verify-tag','--title','${{ github.event.repository.name }} ${{ needs.metadata.outputs.version }}','--generate-notes')
          if ('true' -eq '${{ needs.metadata.outputs.prerelease }}') { $args += @('--prerelease','--latest=false') }
          $args += $assets
          & gh @args
          if (0 -ne $LASTEXITCODE) { throw 'GitHub Release creation failed.' }
